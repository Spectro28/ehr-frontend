<div class="login-container">
  <!-- Panel Izquierdo -->
  <div class="left-panel">
    <div class="left-panel-content">
      <img class="background"  src="/assets/background.png" alt="background">
      <p class="caption">Modulo de Atención Médica</p>
    </div>
  </div>
  
  <!-- Panel Derecho -->
  <div class="right-panel">
    <form (ngSubmit)="login()" #loginForm="ngForm" class="login-form">
      <h2>Iniciar Sesión</h2>
      
      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>
  
      <div *ngIf="successMessage" class="alert alert-success">
        {{ successMessage }}
      </div>
  
    <!-- Reemplazar el campo de usuario por identificación -->
<div class="form-group">
  <label for="identificacion">Identificación</label>
  <input
    type="text"
    id="identificacion"
    name="identificacion"
    [(ngModel)]="formData.identificacion"
    required
    class="form-control"
    placeholder="Ingrese su número de identificación"
  >
</div>
  
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-group">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="formData.password"
            required
            class="form-control"
            (input)="onPasswordInput($event)" 
          >
          <span class="input-group-text" *ngIf="isTyping" (click)="togglePasswordVisibility()" style="cursor: pointer;">
            <img [src]="showPassword ? '/assets/ojo.png' : '/assets/ojo_invisible.png'" alt="eye-icon" class="eye-icon">
          </span>
        </div>
        
      </div>
  
      <!-- Selector de rol (visible solo cuando hay múltiples roles) -->
      <div class="form-group">
        <label for="role">Seleccione su rol</label>
        <select
          id="role"
          name="selectedRole"
          [(ngModel)]="formData.selectedRole"
          required
          class="form-control"
        >
          <option value="">Seleccione un rol</option>
          <option *ngFor="let role of availableRoles" [value]="role">
            {{role}}
          </option>
        </select>
      </div>
  <div class="text-end mt-1">
          <a routerLink="/forgot-password" class="forgot-password-link">¿Olvidó su contraseña?</a>
        </div>
      <button 
        type="submit" 
        [disabled]="isLoading || !loginForm.form.valid || !formData.selectedRole" 
        class="btn btn-primary"
      >
        {{ isLoading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
      </button>
    </form>
  </div>
</div>

<!-- Footer -->
<footer class="login-footer">
  <div class="footer-content">
    <span>© 2025 Copyright EHR-LAB</span>
    <span class="footer-links">
      <a routerLink="/politica-privacidad">Privacy</a>
      <a routerLink="/politica-privacidad">Terms of Use</a>
    </span>
  </div>
</footer>
